title: Auth Failure Base Rule for Credential Stuffing Correlation
id: 3c9d8e7f-1a2b-4c3d-8e9f-0a1b2c3d4e5f
status: experimental
description: >
  Base rule matching individual auth_fail events. Paired with the
  correlation rule below rather than deprecated inline pipe-aggregation
  syntax.
logsource:
  category: honeypot
  product: t-pot
detection:
  selection:
    action: auth_fail
  condition: selection
level: low
---
title: High-Volume Credential Stuffing Against Authentication Service
id: 9e1f2a3b-4c5d-6e7f-8a9b-0c1d2e3f4a5b
status: experimental
description: >
  Detects repeated authentication failures from one source within a
  10-minute window, a standard production brute-force/credential-stuffing
  baseline. NOTE: this rule is designed for deployment against a
  production authentication log, where most auth_fail events are
  legitimate mistyped passwords and this threshold separates that noise
  from genuine attack activity. It will NOT meaningfully trigger against
  this project's honeypot capture: every connection to a honeypot is
  unauthorized by definition, so there is no legitimate baseline within
  that data to distinguish against, and observed per-IP behavior here
  (248 IPs, median 247 total attempts, tightly clustered 247-300, at a
  sustained rate of ~0.09/min) is uniformly low-and-slow rather than
  bursty -- consistent with deliberate rate-limit-evasive automation, not
  a detection gap in this rule.
references:
  - decision-log.md#D-017
author: UBI-2026-0010
date: 2026-07-31
correlation:
  type: event_count
  rules:
    - 3c9d8e7f-1a2b-4c3d-8e9f-0a1b2c3d4e5f
  group-by:
    - source_ip
  timespan: 10m
  condition:
    gte: 5
level: medium
falsepositives:
  - Legitimate but misconfigured client repeatedly retrying with a stale
    credential, in a production (non-honeypot) deployment context.

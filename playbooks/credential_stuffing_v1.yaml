playbook_id: credential-stuffing-v1
name: "Credential Stuffing Response"
description: >
  Responds to a source IP flagged for high-volume authentication failures
  (D-002 in docs/decision-log.md). Enriches with MITRE ATT&CK context and
  CTI reputation, creates a ticket, and notifies the analyst automatically.
  Locking affected accounts is destructive and requires explicit approval.
mitre_techniques: ["T1110.004"]
trigger:
  alert_type: "credential_stuffing_detected"

steps:
  - step_id: "01-mitre-enrich"
    title: "Confirm MITRE ATT&CK technique context"
    action: "mitre_enrich"
    tag: safe
    params: {}
    description: >
      Surfaces the technique already attached during enrichment
      (T1110.004 - Credential Stuffing) in the run timeline.

  - step_id: "02-cti-enrich"
    title: "Confirm source IP reputation"
    action: "cti_enrich_ip"
    tag: safe
    params: {}
    description: >
      Surfaces the AbuseIPDB reputation result already attached during
      enrichment. If no API key was configured, this honestly reports
      the enrichment as unavailable rather than a fabricated score.

  - step_id: "03-create-ticket"
    title: "Create incident ticket"
    action: "create_ticket"
    tag: safe
    params: {priority_from_score: true}
    description: >
      Creates a structured local ticket record with priority derived from
      the CTI abuse confidence score (falls back to 'unknown' priority if
      CTI is unavailable, never guesses a score).

  - step_id: "04-notify-analyst"
    title: "Notify on-call analyst"
    action: "notify"
    tag: safe
    params: {channel: "console"}
    description: >
      Demo-safe console/log notification. No real paging system is
      integrated in this prototype.

  - step_id: "05-lock-account"
    title: "Lock targeted account(s)"
    action: "lock_account"
    tag: requires_approval
    params: {}
    description: >
      DESTRUCTIVE: locking an account also blocks legitimate access if
      the credential match is a false positive. Requires explicit
      analyst approval in the UI. This prototype simulates the action
      (no real IAM system connected) and logs it as such.

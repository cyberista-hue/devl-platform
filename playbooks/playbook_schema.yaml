# playbook_schema.yaml
#
# This documents the required structure every playbook file in
# playbooks/*.yaml must follow. It is not itself an executable playbook --
# playbook_engine.py validates real playbooks against this shape.
#
# Design principle (locked in earlier): every step is tagged either
# "safe" (auto-executes) or "requires_approval" (engine pauses, logs a
# pending action, and waits for an explicit analyst decision before
# proceeding). No step may run without one of these two tags -- the
# engine treats a missing/unknown tag as a hard validation error, not a
# default-safe assumption.

schema_version: 1

# --- required top-level fields for every playbook file ---
playbook_id: string            # unique, e.g. "credential-stuffing-v1"
name: string                   # human-readable
description: string
mitre_techniques: [string]     # e.g. ["T1110.004"] -- must resolve via enrichment/mitre_lookup.py
trigger:
  # what alert condition invokes this playbook. Kept simple and explicit --
  # no fuzzy matching magic. Matched against normalized alert fields
  # produced by the ingestion layer.
  alert_type: string           # e.g. "credential_stuffing_detected"

steps:
  - step_id: string            # unique within this playbook
    title: string               # shown in UI / audit log
    action: string               # machine-readable action name, must exist
                                  # in playbooks/actions_registry.py
    tag: safe | requires_approval   # REQUIRED, no default
    params: {}                   # action-specific parameters
    description: string          # why this step exists, shown in UI for
                                  # analyst context before approval

